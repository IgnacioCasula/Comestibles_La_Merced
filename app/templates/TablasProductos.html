<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Se carga Bootstrap desde CDN -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
     <!-- Carga los estilos de DataTables desde CDN -->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}"> <!-- Carga un archivo CSS -->

</head>
<body class="container mt-5"> <!-- Cuerpo del documento con clase de Bootstrap para espaciado y diseño -->
    <h1 class="mb-4">Productos</h1>
    <a href="{% url 'registrar_producto' %}" class="btn btn-success mb-3">Agregar producto</a>
    <!-- Botón para agregar producto -->
    
    
    



    <!-- Tabla donde se muestran los productos -->
    <table id="productos_table" class="display table table-striped" style="width:100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
                    
        
        </tbody>
    </table>

    <!-- Carga jQuery desde CDN, necesario para DataTables -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Carga el script principal de DataTables desde CDN -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    
    <!-- Script JavaScript que inicializa DataTables y configura su contenido vía AJAX -->
    <script>
        const productosUrl = "{% url 'productos_json' %}";
    </script>

     <script src="{% static 'js/productos.js' %}"></script>

    <!-- Carga los scripts de Bootstrap para funcionalidades interactivas como modales o dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
