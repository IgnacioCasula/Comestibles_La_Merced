<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">

</head>
<body class="container nt-5">
    <h1 class="nb-4">Productos</h1>
    <a href="{% url 'registrar_producto' %}" class="btn btn-succes nb-3">Agregar producto</a>
    
    
    




    <table id="productos_table" class="display table table-striped" style="width:100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
                    
        
        </tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    
    <script>
    $(document).ready(function() {
        $('#productos_table').DataTable({
            ajax: "{% url 'productos_json' %}",
            columns: [
                { data: 'idprod' },
                { data: 'nombre' },
                { data: 'precio' },
                {data: 'stock'},
                {
                    data: 'idprod',
                    render: function(data, type, row) {
                        return `
                            <a href="/editar_producto/${data}" class="btn btn-info btn-sm me-2">Editar</a>
                            <a href="/eliminar_producto/${data}" class="btn btn-danger btn-sm">Eliminar</a>
                        `;
                    },
                    orderable: false,
                    searchable: false
                }
            ]
        });
    });
    </script>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
