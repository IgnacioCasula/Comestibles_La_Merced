<!DOCTYPE html>  
<html lang="en">
<head>
    {% load static %} <!--Esto le dice a Django que vamos a usar archivos estáticos-->
    <meta charset="UTF-8"> <!--Estas etiquetas aseguran que el sitio sea compatible con todos los navegadores y dispositivos móviles.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Indica que el documento se visualiza en dispositivos con pantalla de tamaño más pequeño-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"> 
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}"> <!--El segundo link carga un archivo CSS propio llamado estilos.css desde la carpeta static/css.-->
    <title>Editar</title>
</head>
<body class="container mt-5"> <!--Se usa la clase container mt-5 (de Bootstrap) para que el contenido esté centrado y con márgenes.-->
    <h2 class="mb-4">Editar Producto</h2> <!--Es el título de la página.-->
    <form method="POST" class="mb-3"> <!--El formulario usa el método POST para enviar datos al servidor.-->
        {% csrf_token %} <!--es un token de seguridad que protege contra ataques maliciosos.-->
        {{ form.as_p }} <!--inserta automáticamente los campos del formulario en formato <p>. Esto viene desde una variable form que se le pasa a la plantilla desde la vista de Django.-->
        <button type="submit" class="btn btn-warning">Guardar Cambios</button> <!--El botón "Guardar Cambios" envía el formulario.-->
        <a href="{% url 'listar_elproducto' %}" class="btn btn-secondary">Cancelar</a> <!--El botón "Cancelar" redirige a una vista de Django llamada listar_elproducto.-->
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!--Este archivo Script permite que los componentes interactivos de Bootstrap (como botones, menús, modales, etc.) funcionen correctamente.-->
</body>
</html>
